name: Release

# A tag v* (v0.2.0, or v0.3.0-rc.1 for a prerelease) makes a release:
#   1. checks that versions and changelog match the tag, then typecheck, lint, tests, build on Node 20 and 22;
#   2. tries the installer for real on Windows and on a Mac;
#   3. makes a DRAFT GitHub Release with the npm tarballs and Fairnight-installa.zip;
#   4. waits for a person to approve the "npm" environment, publishes to npm, then makes the release public.
# Until step 4 is approved nothing is public: the zip installs fairnight-cli from npm, so it must
# never be downloadable before our packages are there. The steps live in scripts/release.mjs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Versions and changelog match the tag
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check

  installer:
    uses: ./.github/workflows/installer.yml

  build:
    needs: [test, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm tarballs
        run: node scripts/release.mjs pack release-files
      - name: Installer zip for hosts
        run: |
          node installa/pacchetto.mjs
          cp installa/pacchetto/Fairnight-installa.zip release-files/
      - name: Release notes from the changelog
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release-files/
            release-notes.md
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Draft GitHub Release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* --draft $prerelease \
              --verify-tag --title "OpenStay $version" --notes-file release-notes.md
          fi

  npm:
    needs: draft
    runs-on: ubuntu-latest
    # Protected environment: required reviewers set in Settings → Environments → npm.
    # It holds the NPM_TOKEN secret, so no other job can read it.
    environment:
      name: npm
      url: https://www.npmjs.com/package/fairnight-cli
    permissions:
      contents: write   # to make the draft release public at the end
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish to npm, in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance needs a public repository.
          PROVENANCE: ${{ github.event.repository.private == false && '--provenance' || '' }}
        run: node scripts/release.mjs publish $PROVENANCE
      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
