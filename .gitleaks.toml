title = "OpenStay secret scan"

# Keep every default gitleaks rule, and add the Smoobu, Beds24 and AirROI credentials of Fairnight.
[extend]
useDefault = true

[[rules]]
id = "smoobu-api-credential-env"
description = "Smoobu API key or secret written in an env file or a shell script"
regex = '''(?m)^\s*(?:export\s+|set\s+|\$env:)?SMOOBU_API_(?:KEY|SECRET)\s*=\s*["']?([^\s"'#]{16,})'''
secretGroup = 1
keywords = ["smoobu_api_key", "smoobu_api_secret"]

[[rules]]
id = "smoobu-credentials-file"
description = "The Smoobu credentials file written by 'fairnight smoobu collega'"
path = '''(^|/)smoobu-credentials\.json$'''
regex = '''"api(?:Key|Secret)"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["apikey", "apisecret"]

[[rules]]
id = "beds24-refresh-token-env"
description = "Beds24 refresh token written in an env file or a shell script"
regex = '''(?m)^\s*(?:export\s+|set\s+|\$env:)?BEDS24_REFRESH_TOKEN\s*=\s*["']?([^\s"'#]{16,})'''
secretGroup = 1
keywords = ["beds24_refresh_token"]

[[rules]]
id = "beds24-credentials-file"
description = "The Beds24 credentials file written by 'fairnight beds24 collega'"
path = '''(^|/)beds24-credentials\.json$'''
regex = '''"(?:refreshToken|token)"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["refreshtoken", "token"]

[[rules]]
id = "airroi-api-key-env"
description = "The host's AirROI API key written in an env file or a shell script"
regex = '''(?m)^\s*(?:export\s+|set\s+|\$env:)?AIRROI_API_KEY\s*=\s*["']?([^\s"'#]{16,})'''
secretGroup = 1
keywords = ["airroi_api_key"]

[[rules]]
id = "airroi-credentials-file"
description = "The AirROI key file written by 'fairnight mercato collega'"
path = '''(^|/)airroi-credentials\.json$'''
regex = '''"apiKey"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["apikey"]

[[rules]]
id = "anthropic-api-key-env"
description = "The host's Anthropic API key for the guest assistant, written in an env file or a shell script"
regex = '''(?m)^\s*(?:export\s+|set\s+|\$env:)?ANTHROPIC_API_KEY\s*=\s*["']?([^\s"'#]{16,})'''
secretGroup = 1
keywords = ["anthropic_api_key"]

[[rules]]
id = "fairhello-credentials-file"
description = "The Anthropic key file written by 'fairnight risposte collega'"
path = '''(^|/)fairhello-credentials\.json$'''
regex = '''"anthropicApiKey"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["anthropicapikey"]

[[rules]]
id = "stripe-credentials-file"
description = "The host's own Stripe key file written by 'fairnight pagamenti collega'"
path = '''(^|/)stripe-credentials\.json$'''
regex = '''"secretKey"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["secretkey"]

[[rules]]
id = "stripe-secret-key-env"
description = "The host's Stripe secret key written in an env file or a shell script"
regex = '''(?m)^\s*(?:export\s+|set\s+|\$env:)?STRIPE_SECRET_KEY\s*=\s*["']?([^\s"'#]{16,})'''
secretGroup = 1
keywords = ["stripe_secret_key"]
