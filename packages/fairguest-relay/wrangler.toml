# Fairguest relay on Cloudflare Workers. Deploy, by the maintainer (see README.md):
#   npm run assets -w fairguest-relay && npm run build -w fairguest-relay
#   npx wrangler@4.151.0 deploy --config packages/fairguest-relay/wrangler.toml
# Self-hosting: change name and routes to your own domain; nothing else.
name = "fairguest-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "fairguest.khlumen.com", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
# Every request goes through the worker first: it adds the security headers and serves the page at /c/<box>.
run_worker_first = true

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# No request logs, no traces: the relay keeps nothing about who used it.
[observability]
enabled = false
